<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAN Settings - S136AN</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="main-wrapper">
        <main class="content-area">
            <div class="container-fluid">
                <div class="breadcrumb">
                    <a href="index.html">Home</a>
                    <span>/</span>
                    <span>Configuration</span>
                    <span>/</span>
                    <span>Advanced Setup</span>
                    <span>/</span>
                    <span>WAN Settings</span>
                </div>

                <h1 class="page-title">Wide Area Network (WAN)</h1>
                <p class="text-muted mb-4">Configure your internet connection settings.</p>

                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">WAN Configuration</h2>
                        <span class="badge badge-success">Connected</span>
                    </div>

                    <div class="grid grid-cols-2">
                        <div class="form-group">
                            <label class="form-label">Connection Type</label>
                            <select class="form-control" id="wan_type">
                                <option value="PPPoE">PPPoE</option>
                                <option value="DHCP">Dynamic IP (DHCP)</option>
                                <option value="Static">Static IP</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label">MTU Size</label>
                            <input type="number" class="form-control" value="1492">
                        </div>

                        <div class="form-group">
                            <label class="form-label">Username</label>
                            <input type="text" class="form-control" value="user123">
                        </div>

                        <div class="form-group">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" value="********">
                        </div>

                        <div class="form-group">
                            <label class="form-label">Service Name</label>
                            <input type="text" class="form-control" placeholder="Optional">
                        </div>

                        <div class="form-group">
                            <label class="form-label">VLAN ID</label>
                            <input type="number" class="form-control" value="100">
                        </div>
                    </div>

                    <div class="flex justify-between items-center mt-4">
                        <p class="text-sm text-muted">Contact your ISP if you are unsure about these settings.</p>
                        <div class="flex gap-2">
                            <button class="btn btn-outline">Discard</button>
                            <button class="btn btn-primary">Save Settings</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- JS Files -->
    <script src="../js/sidebar.js"></script>
    <script src="../js/navbar.js"></script>
</body>
</html>
