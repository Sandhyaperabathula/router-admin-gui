<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAN Settings - S136AN</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/wan-settings.css">
    <link rel="stylesheet" href="../css/wan.css">
</head>

<body>

<div class="main-wrapper">

    <main class="content-area">

        <div class="container-fluid">

            <!-- BREADCRUMB -->
            <div class="breadcrumb">
                <a href="index.html">Home</a>
                <span>/</span>
                <span>Network</span>
                <span>/</span>
                <span>WAN Settings</span>
            </div>



<div class="wan-top-section">

    <div class="wan-mode-box">

        <label>
            WAN Mode :
        </label>

        <select class="wan-select">

            <option>
                Dynamic IP Address
            </option>

            <option>
                Static IP Address
            </option>

            <option>
                PPPoE
            </option>

        </select>

    </div>

</div>



<!-- OVERVIEW -->
<div class="overview-section">

    <h3 class="overview-title">
        Overview
    </h3>

    <div class="table-responsive">

        <table class="wan-table">

            <thead>

                <tr>
                    <th>Name</th>
                    <th>Mode</th>
                    <th>VID</th>
                    <th>Status</th>
                    <th>IP Address</th>
                    <th>NetMask</th>
                    <th>Gateway</th>
                    <th>Default Route</th>
                    <th>NAT</th>
                    <th class="actions">Actions</th>
                </tr>

            </thead>


            <tbody>

                <tr>

                    <td>WAN0</td>

                    <td>Dynamic IP</td>

                    <td>10</td>

                    <td>
                        <span class="status-badge connected">
                            Connected
                        </span>
                    </td>

                    <td>10.2.196.74</td>

                    <td>255.252.0.0</td>

                    <td>10.0.0.1</td>

                    <td>
                        <span class="route-check">
                            ✓
                        </span>
                    </td>

                    <td>
                        <span class="nat-enabled">
                            Enable
                        </span>
                    </td>

                    <td>

                        <div class="action-buttons">

                            <button class="table-btn renew-btn">
                                Renew
                            </button>

                            <button class="table-btn release-btn">
                                Release
                            </button>

                            <button class="table-btn edit-btn">
                                Edit
                            </button>

                        </div>

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>

        </div>

    </main>

</div>


<!-- JS -->
<script src="../js/sidebar.js"></script>
<script src="../js/navbar.js"></script>

</body>
</html>
