<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAN Settings - S136AN</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="main-wrapper">
        <main class="content-area">
            <div class="container-fluid">
                <div class="breadcrumb">
                    <a href="index.html">Home</a>
                    <span>/</span>
                    <span>Configuration</span>
                    <span>/</span>
                    <span>Advanced Setup</span>
                    <span>/</span>
                    <span>LAN Settings</span>
                </div>

                <h1 class="page-title">Local Area Network (LAN)</h1>
                <p class="text-muted mb-4">Configure your local network and DHCP server settings.</p>

                <div class="grid grid-cols-1">
                    <!-- LAN IP Settings -->
                    <div class="card">
                        <div class="card-header">
                            <h2 class="card-title">LAN IP Configuration</h2>
                        </div>
                        <div class="grid grid-cols-2">
                            <div class="form-group">
                                <label class="form-label">IP Address</label>
                                <input type="text" class="form-control" value="192.168.1.1">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Subnet Mask</label>
                                <input type="text" class="form-control" value="255.255.255.0">
                            </div>
                        </div>
                    </div>

                    <!-- DHCP Server Settings -->
                    <div class="card">
                        <div class="card-header">
                            <h2 class="card-title">DHCP Server Settings</h2>
                            <label class="switch">
                                <input type="checkbox" checked>
                                <span class="slider"></span>
                            </label>
                        </div>
                        <div class="grid grid-cols-2">
                            <div class="form-group">
                                <label class="form-label">Start IP Address</label>
                                <input type="text" class="form-control" value="192.168.1.2">
                            </div>
                            <div class="form-group">
                                <label class="form-label">End IP Address</label>
                                <input type="text" class="form-control" value="192.168.1.254">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Lease Time (minutes)</label>
                                <input type="number" class="form-control" value="1440">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Domain Name</label>
                                <input type="text" class="form-control" placeholder="gateway.local">
                            </div>
                        </div>
                    </div>

                    <div class="flex justify-end gap-2">
                        <button class="btn btn-outline">Discard</button>
                        <button class="btn btn-primary">Apply Settings</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- JS Files -->
    <script src="../js/sidebar.js"></script>
    <script src="../js/navbar.js"></script>
</body>
</html>
