<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Statistics - S136AN</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/traffic.css">
</head>

<body>

<div class="main-wrapper">

    <main class="content-area">

        <div class="container-fluid">

            <!-- BREADCRUMB -->
            <div class="breadcrumb">
                <a href="index.html">Home</a>
                <span>/</span>
                <span>Monitoring</span>
                <span>/</span>
                <span>Traffic Statistics</span>
            </div>

            <!-- CARD -->
            <div class="card traffic-card">

                <!-- TITLE -->
                <div class="card-header">
                    <h2 class="card-title">
                        Traffic Statistics
                    </h2>
                </div>

                <!-- TOP INTERFACE -->
                <div class="interface-selector">

                    <div class="selector-row">

                        <span class="selector-title">
                            Interface :
                        </span>

                        <label>
                            <input 
                                type="radio" 
                                name="interface"
                                checked
                                onclick="loadTable('ethernet')">

                            Ethernet
                        </label>

                        <label>
                            <input 
                                type="radio" 
                                name="interface"
                                onclick="loadTable('wlan')">

                            WLAN
                        </label>

                        <label>
                            <input 
                                type="radio" 
                                name="interface"
                                onclick="loadTable('pon')">

                            PON
                        </label>

                        <label>
                            <input 
                                type="radio" 
                                name="interface"
                                onclick="loadTable('wan')">

                            WAN
                        </label>

                    </div>

                    <!-- BOTTOM ROW -->
                    <div class="selector-row" id="subInterfaces">

                    </div>

                </div>

                <!-- TABLE -->
                <div class="table-responsive">

                    <table class="traffic-table">

                        <thead>
                            <tr>
                                <th>Transmit Statistics</th>
                                <th>Value</th>
                                <th>Receive Statistics</th>
                                <th>Value</th>
                            </tr>
                        </thead>

                        <tbody id="trafficTableBody">

                        </tbody>

                    </table>

                </div>

                <!-- BUTTONS -->
                <div class="traffic-actions">

                    <button 
                        class="traffic-btn refresh-btn"
                        onclick="refreshStatistics()">

                        Refresh

                    </button>

                    <button 
                        class="traffic-btn clear-btn"
                        onclick="clearStatistics()">

                        Clear

                    </button>

                </div>

            </div>

        </div>

    </main>

</div>

/* =========================
   LOAD TABLE
========================= */

function loadTable(type){

    document.getElementById("trafficTableBody").innerHTML =
        trafficData[type].rows;

    document.getElementById("subInterfaces").innerHTML =
        trafficData[type].subRow;

}



/* =========================
   REFRESH
========================= */

function refreshStatistics(){

    const values = document.querySelectorAll(
        ".traffic-table td:nth-child(2), .traffic-table td:nth-child(4)"
    );

    values.forEach((cell) => {

        if(cell.textContent !== "N/A"){

            cell.textContent =
                Math.floor(Math.random() * 9999999);

        }

    });

}



/* =========================
   CLEAR
========================= */

function clearStatistics(){

    const values = document.querySelectorAll(
        ".traffic-table td:nth-child(2), .traffic-table td:nth-child(4)"
    );

    values.forEach((cell) => {

        if(cell.textContent !== "N/A"){

            cell.textContent = "0";

        }

    });

}



/* =========================
   DEFAULT LOAD
========================= */

window.onload = function(){

    loadTable("ethernet");
