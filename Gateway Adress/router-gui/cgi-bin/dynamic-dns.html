<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAN Settings - S136AN</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/lan-settings.css">
    <link rel="stylesheet" href="../css/lan.css">
    <link rel="stylesheet" href="../css/dynmic.css">
</head>

<body>

<div class="main-wrapper">

    <main class="content-area">

        <div class="container-fluid">

            <!-- BREADCRUMB -->
            <div class="breadcrumb">
                <a href="index.html">Home</a>
                <span>/</span>
                <span>Network</span>
                <span>/</span>
                <span>Dynamic DNS Settings</span>
            </div>

<div class="settings-section">

    <h3 class="section-title">
        Dynamic DNS
    </h3>


    <div class="ddns-row">

        <div class="ddns-label">
            Dynamic DNS :
        </div>

        <div class="ddns-control">

            <label>
                <input type="radio" checked>
                Activated
            </label>

            <label>
                <input type="radio">
                Deactivated
            </label>

        </div>

    </div>


    <div class="ddns-row">

        <div class="ddns-label">
            Interface :
        </div>

        <div class="ddns-control">

            <select class="ddns-select">

                <option>
                    WAN0
                </option>

            </select>

        </div>

    </div>


    <div class="ddns-row">

        <div class="ddns-label">
            Service Mode :
        </div>

        <div class="ddns-control">

            <label>
                <input type="radio" checked>
                Automatically
            </label>

            <label>
                <input type="radio">
                Manually
            </label>

        </div>

    </div>


    <div class="ddns-row">

        <div class="ddns-label">
            Service Provider :
        </div>

        <div class="ddns-control">

            <select class="ddns-select">

                <option>
                    www.dyn.com
                </option>

            </select>

        </div>

    </div>


    <div class="ddns-row">

        <div class="ddns-label">
            My Host Name :
        </div>

        <div class="ddns-control">

            <input 
                type="text"
                class="ddns-input">

        </div>

    </div>


    <div class="ddns-row">

        <div class="ddns-label">
            Username :
        </div>

        <div class="ddns-control">

            <input 
                type="text"
                class="ddns-input">

        </div>

    </div>


    <div class="ddns-row">

        <div class="ddns-label">
            Password :
        </div>

        <div class="ddns-control">

            <input 
                type="password"
                class="ddns-input">

        </div>

    </div>


    <div class="ddns-row">

        <div class="ddns-label">
            Wildcard support :
        </div>

        <div class="ddns-control">

            <label>
                <input type="radio" checked>
                Yes
            </label>

            <label>
                <input type="radio">
                No
            </label>

        </div>

    </div>


    <div class="ddns-row">

        <div class="ddns-label">
            Status :
        </div>

        <div class="ddns-control">

            <span class="status-badge">
                Unconfigured
            </span>

        </div>

    </div>


    <div class="settings-actions">

        <button class="apply-btn">
            Apply
        </button>

    </div>

</div>
</div>
    </main>

</div>

<script src="../js/sidebar.js"></script>
<script src="../js/navbar.js"></script>

</body>
</html>
