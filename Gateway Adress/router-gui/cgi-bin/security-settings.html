<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Settings - Router Admin</title>
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval'; script-src * 'unsafe-inline' 'unsafe-eval'; connect-src * 'unsafe-inline'; img-src * data: blob: 'unsafe-inline'; style-src * 'unsafe-inline';">
    <link rel="stylesheet" href="../../css/sidebar.css">
</head>
<body>
    <script src="../../js/sidebar.js"></script>
    <script src="../../js/api-client.js"></script>

    <div class="main-content">
        <h1>Wireless Security Settings</h1>
        <table class="info-table">
            <tr>
                <th>Authentication Type</th>
                <td>
                    <select id="authType">
                        <option value="WPA2-PSK (AES)">WPA2-PSK (AES)</option>
                        <option value="WPA-PSK (TKIP)">WPA-PSK (TKIP)</option>
                        <option value="Mixed WPA2/WPA-PSK">Mixed WPA2/WPA-PSK</option>
                        <option value="WEP">WEP</option>
                    </select>
                </td>
            </tr>
            <tr>
                <th>Security Key</th>
                <td><input type="password" id="securityKey" value="password123"></td>
            </tr>
        </table>
        <br>
        <button id="saveSecurity" style="padding: 10px 30px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Save Settings</button>

    <script>
    // Function to load settings
    async function loadSettings() {
        try {
            const config = await ApiClient.fetch("load_security");
            if (config.authType) document.getElementById("authType").value = config.authType;
            if (config.securityKey) document.getElementById("securityKey").value = config.securityKey;
        } catch (error) {
            console.error("Error loading settings:", error);
        }
    }

    // Function to save settings
    async function saveSettings() {
        const formData = new URLSearchParams();
        formData.append("action", "save_security");
        formData.append("authType", document.getElementById("authType").value);
        formData.append("securityKey", document.getElementById("securityKey").value);

        const result = await ApiClient.fetch("save_security", "POST", formData);
        if (result.status === "success") {
            ApiClient.showNotification(result.message);
        } else {
            ApiClient.showNotification(result.message || "Error saving settings", true);
        }
    }

    document.getElementById("saveSecurity").addEventListener("click", saveSettings);
    window.addEventListener("DOMContentLoaded", loadSettings);
    </script>
    </div>

    <script src="../../js/navbar.js"></script>
</body>
</html>
