<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firewall Settings - S136AN</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="main-wrapper">
        <main class="content-area">
            <div class="container-fluid">
                <div class="breadcrumb">
                    <a href="index.html">Home</a>
                    <span>/</span>
                    <span>Configuration</span>
                    <span>/</span>
                    <span>Firewall Setup</span>
                </div>

                <h1 class="page-title">Security Firewall</h1>
                <p class="text-muted mb-4">Protect your network from unauthorized access and attacks.</p>

                <div class="grid grid-cols-1">
                    <div class="card">
                        <div class="card-header">
                            <h2 class="card-title">General Firewall Settings</h2>
                            <label class="switch">
                                <input type="checkbox" checked>
                                <span class="slider"></span>
                            </label>
                        </div>
                        <div class="grid grid-cols-2">
                            <div class="form-group">
                                <label class="form-label">Firewall Level</label>
                                <select class="form-control">
                                    <option value="High">High (Restrictive)</option>
                                    <option value="Medium" selected>Medium (Recommended)</option>
                                    <option value="Low">Low (Permissive)</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">SPI Firewall</label>
                                <select class="form-control">
                                    <option value="Enabled">Enabled</option>
                                    <option value="Disabled">Disabled</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-header">
                            <h2 class="card-title">Security Features</h2>
                        </div>
                        <div class="grid grid-cols-3">
                            <div class="form-group">
                                <div class="flex items-center gap-2">
                                    <input type="checkbox" id="dos_prot" checked>
                                    <label for="dos_prot" class="text-sm">DoS Protection</label>
                                </div>
                            </div>
                            <div class="form-group">
                                <div class="flex items-center gap-2">
                                    <input type="checkbox" id="ping_wan" checked>
                                    <label for="ping_wan" class="text-sm">Block WAN Ping</label>
                                </div>
                            </div>
                            <div class="form-group">
                                <div class="flex items-center gap-2">
                                    <input type="checkbox" id="upnp">
                                    <label for="upnp" class="text-sm">Enable UPnP</label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="flex justify-end gap-2">
                        <button class="btn btn-outline">Cancel</button>
                        <button class="btn btn-primary">Save Changes</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- JS Files -->
    <script src="../js/sidebar.js"></script>
    <script src="../js/navbar.js"></script>
</body>
</html>
