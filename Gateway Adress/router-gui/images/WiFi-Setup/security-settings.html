<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Settings - Router Admin</title>
    <link rel="stylesheet" href="../router-gui/css/sidebar.css">
</head>
<body>
    <script src="../router-gui/js/sidebar.js"></script>

    <div class="main-content">
        <h1>Wireless Security Settings</h1>
        <table class="info-table">
            <tr>
                <th>Authentication Type</th>
                <td>
                    <select>
                        <option>WPA2-PSK (AES)</option>
                        <option>WPA-PSK (TKIP)</option>
                        <option>Mixed WPA2/WPA-PSK</option>
                        <option>WEP</option>
                    </select>
                </td>
            </tr>
            <tr>
                <th>Security Key</th>
                <td><input type="password" value="password123"></td>
            </tr>
        </table>
        <br>
        <button style="padding: 5px 15px; background: #efefef; border: 1px solid #999; cursor: pointer;">Save Settings</button>
    </div>

    <script src="../router-gui/js/navbar.js"></script>
</body>
</html>
