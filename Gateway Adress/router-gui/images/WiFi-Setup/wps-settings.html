<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WPS Settings - Router Admin</title>
    <link rel="stylesheet" href="../router-gui/css/sidebar.css">
</head>
<body>
    <script src="../router-gui/js/sidebar.js"></script>

    <div class="main-content">
        <h1>WPS Settings</h1>
        <table class="info-table">
            <tr>
                <th>WPS Status</th>
                <td><input type="checkbox" checked> Enabled</td>
            </tr>
            <tr>
                <th>Current PIN</th>
                <td>12345678</td>
            </tr>
            <tr>
                <th>Configured</th>
                <td>Yes</td>
            </tr>
        </table>
        <br>
        <button style="padding: 5px 15px; background: #efefef; border: 1px solid #999; cursor: pointer;">Generate New PIN</button>
    </div>

    <script src="../router-gui/js/navbar.js"></script>
</body>
</html>
